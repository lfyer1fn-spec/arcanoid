<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арканоид</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1040 0%, #07051a 70%);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: #e8e8ff;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    position: relative;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(120, 80, 255, 0.45), 0 0 120px rgba(0, 200, 255, 0.15);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: linear-gradient(180deg, #0b0822 0%, #120b30 100%);
    cursor: none;
  }
  #hud {
    position: absolute;
    top: 10px; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 18px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
    pointer-events: none;
    text-shadow: 0 0 8px #7b5cff;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: rgba(7, 5, 26, 0.55);
    backdrop-filter: blur(3px);
    text-align: center;
  }
  #overlay h1 {
    font-size: 54px;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #ff6ec7, #7b5cff, #00e5ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(123, 92, 255, 0.7));
  }
  #overlay p { opacity: 0.85; font-size: 15px; line-height: 1.6; }
  #overlay button {
    padding: 12px 36px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    background: linear-gradient(90deg, #ff3ea5, #7b5cff);
    border: none; border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 62, 165, 0.5);
    transition: transform .15s, box-shadow .15s;
  }
  #overlay button:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(255, 62, 165, 0.8); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="hud"><span id="score">Очки: 0</span><span id="level">Уровень 1</span><span id="lives">❤❤❤</span></div>
  <div id="overlay">
    <h1>АРКАНОИД</h1>
    <p>Управление: мышь / ← → / A D &nbsp;•&nbsp; Пробел или клик — запуск мяча<br>P — пауза</p>
    <button id="startBtn">СТАРТ</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const overlayTitle = overlay.querySelector('h1');
  const overlayText = overlay.querySelector('p');

  // ---------- Состояние ----------
  const PADDLE_W_BASE = 110, PADDLE_H = 14, PADDLE_Y = H - 40;
  const BALL_R = 8;
  const BRICK_COLS = 10, BRICK_W = 70, BRICK_H = 24, BRICK_GAP = 6;
  const BRICK_OFFSET_X = (W - (BRICK_COLS * (BRICK_W + BRICK_GAP) - BRICK_GAP)) / 2;
  const BRICK_OFFSET_Y = 80;

  const PALETTES = [
    ['#ff3ea5', '#ff7ab6'], ['#ff9f1c', '#ffd166'], ['#ffe066', '#fff3b0'],
    ['#06d6a0', '#8af5d0'], ['#00b4ff', '#8ee6ff'], ['#7b5cff', '#c0aaff']
  ];

  let state = 'menu'; // menu | ready | playing | paused | gameover | win
  let score = 0, lives = 3, level = 1;
  let paddle, balls, bricks, particles, powerups, lasers, shake = 0, time = 0;
  let mouseX = W / 2;
  const keys = {};

  // Звёзды на фоне
  const stars = Array.from({ length: 120 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    z: Math.random() * 0.8 + 0.2, t: Math.random() * Math.PI * 2
  }));

  // ---------- Звук (WebAudio, без файлов) ----------
  let audioCtx = null;
  function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.05) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- Уровни ----------
  // 0 = пусто, 1..6 = цвет/прочность, 9 = неразрушимый
  const LEVELS = [
    // 1: простая сетка
    () => {
      const m = [];
      for (let r = 0; r < 6; r++) m.push(Array(BRICK_COLS).fill(r % 6 + 1));
      return m;
    },
    // 2: ромб
    () => {
      const m = Array.from({ length: 8 }, () => Array(BRICK_COLS).fill(0));
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          const d = Math.abs(c - 4.5) + Math.abs(r - 3.5);
          if (d < 5.5) m[r][c] = (Math.floor(d) % 6) + 1;
        }
      }
      return m;
    },
    // 3: шахматка с прочными кирпичами
    () => {
      const m = [];
      for (let r = 0; r < 8; r++) {
        const row = [];
        for (let c = 0; c < BRICK_COLS; c++) {
          row.push((r + c) % 2 ? (r % 6) + 1 : (r % 3 === 0 ? 9 : 0));
        }
        m.push(row);
      }
      return m;
    },
    // 4: "Волна" + крепость
    () => {
      const m = Array.from({ length: 9 }, () => Array(BRICK_COLS).fill(0));
      for (let c = 0; c < BRICK_COLS; c++) {
        const r = Math.round(4 + Math.sin(c * 0.8) * 3);
        m[Math.max(0, Math.min(8, r))][c] = 9;
        for (let k = 0; k < 2; k++) {
          const rr = Math.max(0, Math.min(8, r + k + 1));
          m[rr][c] = (c % 6) + 1;
        }
      }
      return m;
    }
  ];

  // ---------- Инициализация ----------
  function makeBall(x, y, vx, vy, glue = false) {
    return { x, y, vx, vy, r: BALL_R, glue, trail: [], fire: 0 };
  }

  function resetPaddle() {
    paddle = {
      x: W / 2 - PADDLE_W_BASE / 2,
      w: PADDLE_W_BASE,
      widthTimer: 0,
      laserTimer: 0,
      lastShot: 0
    };
  }

  function buildLevel(n) {
    const layout = LEVELS[(n - 1) % LEVELS.length]();
    bricks = [];
    layout.forEach((row, r) => row.forEach((v, c) => {
      if (!v) return;
      bricks.push({
        x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP),
        y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_GAP),
        w: BRICK_W, h: BRICK_H,
        hp: v === 9 ? Infinity : v,
        maxHp: v === 9 ? 1 : v,
        indestructible: v === 9,
        color: v === 9 ? ['#5a5a7a', '#9a9ab8'] : PALETTES[(v - 1) % PALETTES.length],
        hit: 0,
        alive: true
      });
    }));
  }

  function resetBall() {
    balls = [makeBall(paddle.x + paddle.w / 2, PADDLE_Y - BALL_R - 2, 0, 0, true)];
  }

  function newGame() {
    score = 0; lives = 3; level = 1;
    startLevel();
  }

  function startLevel() {
    resetPaddle();
    buildLevel(level);
    particles = [];
    powerups = [];
    lasers = [];
    resetBall();
    state = 'ready';
    updateHUD();
    hideOverlay();
  }

  function speedFor() {
    return 6.2 + (level - 1) * 0.35;
  }

  // ---------- HUD / оверлей ----------
  function updateHUD() {
    scoreEl.textContent = 'Очки: ' + score;
    levelEl.textContent = 'Уровень ' + level;
    livesEl.textContent = '❤'.repeat(Math.max(0, lives)) || '✖';
  }
  function showOverlay(title, text, btn) {
    overlayTitle.textContent = title;
    overlayText.innerHTML = text;
    startBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  // ---------- Частицы ----------
  function burst(x, y, color, n = 16, power = 4) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * power;
      particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, decay: 0.02 + Math.random() * 0.03,
        size: 1 + Math.random() * 3, color
      });
    }
  }

  // ---------- Бонусы ----------
  const POWER_TYPES = [
    { k: 'wide', label: 'W', color: '#06d6a0' },
    { k: 'multi', label: 'M', color: '#ffd166' },
    { k: 'laser', label: 'L', color: '#ff3ea5' },
    { k: 'life', label: '+', color: '#00e5ff' }
  ];

  function maybeDrop(b) {
    if (Math.random() < 0.18) {
      const t = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
      powerups.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vy: 2.2, ...t, r: 12 });
    }
  }

  function applyPower(t) {
    beep(880, 0.15, 'triangle', 0.08);
    if (t.k === 'wide') paddle.widthTimer = 60 * 10;
    if (t.k === 'laser') paddle.laserTimer = 60 * 8;
    if (t.k === 'life') lives = Math.min(lives + 1, 5);
    if (t.k === 'multi') {
      const extra = [];
      balls.forEach(b => {
        for (const ang of [-0.5, 0.5]) {
          const sp = Math.hypot(b.vx, b.vy) || speedFor();
          const a0 = Math.atan2(b.vy, b.vx) + ang;
          extra.push(makeBall(b.x, b.y, Math.cos(a0) * sp, Math.sin(a0) * sp));
        }
      });
      balls.push(...extra.slice(0, 6));
    }
    updateHUD();
  }

  // ---------- Обновление ----------
  function update() {
    time++;
    stars.forEach(s => { s.y += s.z * 0.4; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
    if (shake > 0) shake *= 0.85;

    // Движение платформы
    const speedKey = 9;
    if (keys.left) mouseX -= speedKey;
    if (keys.right) mouseX += speedKey;
    mouseX = Math.max(PADDLE_W_BASE / 2, Math.min(W - PADDLE_W_BASE / 2, mouseX));
    const curW = paddle.widthTimer > 0 ? PADDLE_W_BASE * 1.5 : PADDLE_W_BASE;
    paddle.w = curW;
    paddle.x += ((mouseX - curW / 2) - paddle.x) * 0.35;
    if (paddle.widthTimer > 0) paddle.widthTimer--;
    if (paddle.laserTimer > 0) paddle.laserTimer--;

    // Лазеры
    if (paddle.laserTimer > 0 && time - paddle.lastShot > 18) {
      paddle.lastShot = time;
      lasers.push({ x: paddle.x + 10, y: PADDLE_Y - 4 });
      lasers.push({ x: paddle.x + paddle.w - 10, y: PADDLE_Y - 4 });
      beep(1200, 0.05, 'sawtooth', 0.03);
    }
    lasers.forEach(l => l.y -= 12);
    lasers = lasers.filter(l => {
      if (l.y < 0) return false;
      for (const b of bricks) {
        if (!b.alive || b.indestructible) continue;
        if (l.x > b.x && l.x < b.x + b.w && l.y > b.y && l.y < b.y + b.h) {
          damageBrick(b, 1);
          return false;
        }
      }
      return true;
    });

    // Прилипший мяч
    balls.forEach(b => {
      if (b.glue) {
        b.x = paddle.x + paddle.w / 2;
        b.y = PADDLE_Y - BALL_R - 2;
      }
    });

    // Движение мячей
    const speed = speedFor();
    for (const b of balls) {
      if (b.glue) continue;
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 10) b.trail.shift();

      // Нормализация скорости
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 0) {
        const k = speed / sp;
        b.vx *= k; b.vy *= k;
      }

      b.x += b.vx; b.y += b.vy;

      // Стены
      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); beep(330, 0.03); }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); beep(330, 0.03); }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); beep(330, 0.03); }

      // Платформа
      if (b.vy > 0 && b.y + b.r >= PADDLE_Y && b.y + b.r <= PADDLE_Y + PADDLE_H + 8 &&
          b.x >= paddle.x - b.r && b.x <= paddle.x + paddle.w + b.r) {
        const rel = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const ang = rel * (Math.PI / 3); // до 60 градусов
        b.vx = Math.sin(ang) * speed;
        b.vy = -Math.cos(ang) * speed;
        b.y = PADDLE_Y - b.r;
        beep(520 + rel * 80, 0.05, 'square', 0.06);
        burst(b.x, PADDLE_Y, '#7b5cff', 8, 2.5);
        shake = 3;
      }
    }

    // Кирпичи — столкновения
    for (const b of balls) {
      if (b.glue) continue;
      for (const br of bricks) {
        if (!br.alive) continue;
        const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
        const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
        const dx = b.x - cx, dy = b.y - cy;
        if (dx * dx + dy * dy <= b.r * b.r) {
          // Определяем сторону удара
          const overlapX = Math.min(Math.abs(b.x - br.x), Math.abs(b.x - (br.x + br.w)));
          const overlapY = Math.min(Math.abs(b.y - br.y), Math.abs(b.y - (br.y + br.h)));
          if (overlapX < overlapY) b.vx = -b.vx; else b.vy = -b.vy;
          damageBrick(br, 1);
          break;
        }
      }
    }

    // Падение мячей
    balls = balls.filter(b => b.glue || b.y - b.r <= H);
    balls.forEach(b => { if (b.y > H + 20) b.dead = true; });
    balls = balls.filter(b => !b.dead);

    if (balls.length === 0) {
      lives--;
      shake = 12;
      beep(140, 0.4, 'sawtooth', 0.12);
      updateHUD();
      if (lives <= 0) {
        state = 'gameover';
        showOverlay('ИГРА ОКОНЧЕНА', `Счёт: <b>${score}</b><br>Нажми, чтобы начать заново`, 'ЕЩЁ РАЗ');
        return;
      }
      resetBall();
      state = 'ready';
    }

    // Бонусы
    powerups.forEach(p => p.y += p.vy);
    powerups = powerups.filter(p => {
      if (p.y > H) return false;
      if (p.y + p.r > PADDLE_Y && p.y - p.r < PADDLE_Y + PADDLE_H &&
          p.x > paddle.x && p.x < paddle.x + paddle.w) {
        applyPower(p);
        burst(p.x, p.y, p.color, 24, 5);
        return false;
      }
      return true;
    });

    // Частицы
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= p.decay;
    });
    particles = particles.filter(p => p.life > 0);

    // Проверка победы
    const remaining = bricks.some(b => b.alive && !b.indestructible);
    if (!remaining) {
      level++;
      state = 'win';
      beep(660, 0.2, 'triangle', 0.1);
      setTimeout(() => beep(880, 0.25, 'triangle', 0.1), 150);
      setTimeout(() => beep(1100, 0.3, 'triangle', 0.1), 300);
      showOverlay(`УРОВЕНЬ ${level - 1} ПРОЙДЕН!`, `Очки: <b>${score}</b>`, 'ДАЛЬШЕ');
    }
  }

  function damageBrick(b, dmg) {
    if (b.indestructible) {
      b.hit = 8;
      burst(b.x + b.w / 2, b.y + b.h / 2, '#9a9ab8', 6, 2);
      beep(200, 0.04, 'square', 0.03);
      return;
    }
    b.hp -= dmg;
    b.hit = 8;
    beep(600 + Math.random() * 300, 0.05, 'square', 0.04);
    if (b.hp <= 0) {
      b.alive = false;
      score += 10 * level;
      burst(b.x + b.w / 2, b.y + b.h / 2, b.color[0], 22, 5);
      shake = 4;
      maybeDrop(b);
      updateHUD();
    } else {
      score += 2;
      burst(b.x + b.w / 2, b.y + b.h / 2, b.color[1], 6, 2);
      updateHUD();
    }
  }

  // ---------- Отрисовка ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.save();
    if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // Фон
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b0822'); bg.addColorStop(1, '#1a0f3d');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Звёзды
    stars.forEach(s => {
      const a = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.02 + s.t));
      ctx.fillStyle = `rgba(200,200,255,${a * s.z})`;
      ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2);
    });

    // Кирпичи
    for (const b of bricks) {
      if (!b.alive) continue;
      const pulse = b.hit > 0 ? b.hit / 8 : 0;
      if (b.hit > 0) b.hit--;
      const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      g.addColorStop(0, b.color[1]);
      g.addColorStop(0.5, b.color[0]);
      g.addColorStop(1, shade(b.color[0], -35));
      ctx.save();
      ctx.shadowColor = b.color[0];
      ctx.shadowBlur = 12 + pulse * 20;
      ctx.fillStyle = g;
      roundRect(b.x, b.y, b.w, b.h, 6);
      ctx.fill();
      ctx.restore();
      // блик
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      roundRect(b.x + 4, b.y + 3, b.w - 8, 5, 3);
      ctx.fill();
      if (b.indestructible) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        roundRect(b.x + 3, b.y + 3, b.w - 6, b.h - 6, 4);
        ctx.stroke();
      }
      if (!b.indestructible && b.maxHp > 1 && b.hp < b.maxHp) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(b.x + 6, b.y + b.h - 6, (b.w - 12) * (b.hp / b.maxHp), 2);
      }
    }

    // Лазеры
    lasers.forEach(l => {
      ctx.save();
      ctx.shadowColor = '#ff3ea5'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff9bd2';
      ctx.fillRect(l.x - 2, l.y, 4, 14);
      ctx.restore();
    });

    // Платформа
    const px = paddle.x, py = PADDLE_Y, pw = paddle.w;
    ctx.save();
    ctx.shadowColor = paddle.laserTimer > 0 ? '#ff3ea5' : '#7b5cff';
    ctx.shadowBlur = 22;
    const pg = ctx.createLinearGradient(px, py, px, py + PADDLE_H);
    pg.addColorStop(0, '#e0d4ff'); pg.addColorStop(0.5, '#7b5cff'); pg.addColorStop(1, '#3a1f8a');
    ctx.fillStyle = pg;
    roundRect(px, py, pw, PADDLE_H, PADDLE_H / 2);
    ctx.fill();
    ctx.restore();
    if (paddle.laserTimer > 0) {
      ctx.fillStyle = '#ff3ea5';
      ctx.fillRect(px + 6, py - 4, 6, 4);
      ctx.fillRect(px + pw - 12, py - 4, 6, 4);
    }

    // Бонусы
    powerups.forEach(p => {
      ctx.save();
      ctx.shadowColor = p.color; ctx.shadowBlur = 16;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#07051a';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x, p.y + 1);
    });

    // Мячи
    for (const b of balls) {
      b.trail.forEach((t, i) => {
        const a = (i / b.trail.length) * 0.35;
        ctx.fillStyle = `rgba(0,229,255,${a})`;
        ctx.beginPath(); ctx.arc(t.x, t.y, b.r * (i / b.trail.length), 0, Math.PI * 2); ctx.fill();
      });
      ctx.save();
      ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 20;
      const bg2 = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, b.r);
      bg2.addColorStop(0, '#ffffff'); bg2.addColorStop(0.4, '#8ef3ff'); bg2.addColorStop(1, '#00a8d6');
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Частицы
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Подсказка
    if (state === 'ready') {
      ctx.fillStyle = 'rgba(232,232,255,0.8)';
      ctx.font = '16px Segoe UI, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Пробел / клик — запуск', W / 2, H / 2 + 60 + Math.sin(time * 0.1) * 3);
    }

    ctx.restore();
  }

  function shade(hex, pct) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + pct, g = ((n >> 8) & 255) + pct, b = (n & 255) + pct;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return `rgb(${r},${g},${b})`;
  }

  // ---------- Цикл ----------
  function loop() {
    if (state === 'playing') update();
    else if (state === 'ready') {
      // Платформа двигается даже в ожидании
      mouseX += (keys.left ? -9 : 0) + (keys.right ? 9 : 0);
      mouseX = Math.max(PADDLE_W_BASE / 2, Math.min(W - PADDLE_W_BASE / 2, mouseX));
      paddle.x += ((mouseX - paddle.w / 2) - paddle.x) * 0.35;
      balls.forEach(b => { if (b.glue) { b.x = paddle.x + paddle.w / 2; b.y = PADDLE_Y - BALL_R - 2; } });
      time++;
      stars.forEach(s => { s.y += s.z * 0.4; if (s.y > H) s.y = 0; });
    }
    if (state !== 'menu' && paddle) draw();
    else drawMenuBg();
    requestAnimationFrame(loop);
  }

  function drawMenuBg() {
    ctx.fillStyle = '#0b0822';
    ctx.fillRect(0, 0, W, H);
    stars.forEach(s => {
      s.y += s.z * 0.5; if (s.y > H) s.y = 0;
      ctx.fillStyle = `rgba(200,200,255,${s.z})`;
      ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2);
    });
  }

  // ---------- Управление ----------
  function launch() {
    if (state === 'ready') {
      const b = balls.find(b => b.glue);
      if (b) {
        b.glue = false;
        const a = (Math.random() - 0.5) * 0.6 - Math.PI / 2;
        b.vx = Math.cos(a) * speedFor();
        b.vy = Math.sin(a) * speedFor();
      }
      state = 'playing';
      beep(440, 0.08, 'triangle', 0.08);
    }
  }

  function togglePause() {
    if (state === 'playing') { state = 'paused'; showOverlay('ПАУЗА', 'Нажми P или кнопку, чтобы продолжить', 'ПРОДОЛЖИТЬ'); }
    else if (state === 'paused') { state = 'playing'; hideOverlay(); }
  }

  function canvasX(clientX) {
    const r = canvas.getBoundingClientRect();
    return (clientX - r.left) * (W / r.width);
  }

  canvas.addEventListener('mousemove', e => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault(); mouseX = canvasX(e.touches[0].clientX);
  }, { passive: false });
  canvas.addEventListener('mousedown', () => launch());
  canvas.addEventListener('touchstart', e => { mouseX = canvasX(e.touches[0].clientX); launch(); }, { passive: true });

  document.addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'Space') launch();
    if (e.code === 'KeyP') togglePause();
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });

  startBtn.addEventListener('click', () => {
    if (state === 'menu' || state === 'gameover') { newGame(); }
    else if (state === 'win') { startLevel(); }
    else if (state === 'paused') { togglePause(); }
    beep(700, 0.1, 'triangle', 0.08);
  });

  // Старт
  resetPaddle();
  showOverlay('АРКАНОИД', 'Управление: мышь / ← → / A D &nbsp;•&nbsp; Пробел или клик — запуск мяча<br>P — пауза', 'СТАРТ');
  state = 'menu';
  loop();
})();
</script>
</body>
</html>
